<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fox 的个人主页，记录博客、笔记与折腾日常" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Empty · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 40%, #fbc2eb 100%);
            background-attachment: fixed;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 56px 20px 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰圆 */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #c2e9fb;
            top: -80px;
            left: -80px;
        }

        body::after {
            width: 380px;
            height: 380px;
            background: #ffd6f5;
            bottom: -120px;
            right: -120px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow:
                0 20px 50px rgba(31, 41, 55, 0.15),
                0 8px 20px rgba(31, 41, 55, 0.08);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: white;
            box-shadow:
                0 10px 25px rgba(102, 126, 234, 0.45),
                0 0 0 6px rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 12px;
            color: #4f46e5;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            margin-bottom: 14px;
        }

        .desc {
            font-size: 15px;
            line-height: 1.7;
            color: #4b5563;
            margin-bottom: 28px;
        }

        .links {
            display: grid;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 16px;
            text-decoration: none;
            color: #1f2937;
            font-size:16px;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .link-item:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
        }

        footer {
            margin-top: 32px;
            font-size:13px;
            color:#6b7280;
        }

        /* 暗黑模式 */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg,#1e1b4b,#312e81,#4c1d95);
            }
            body::before{
                background:#4f46e5;
            }
            body::after{
                background:#7c3aed;
            }
            .card{
                background:rgba(17,24,39,0.45);
                border:1px solid rgba(255,255,255,0.12);
            }
            .link-item{
                background:rgba(30,41,59,0.65);
                border:1px solid rgba(255,255,255,0.1);
                color:#e5e7eb;
            }
            .link-item:hover{
                background:rgba(51,65,85,0.75);
            }
            .desc{
                color:#a5b4fc;
            }
            .badge{
                color:#c7d2fe;
                background:rgba(124,58,237,0.25);
                border-color:rgba(167,139,250,0.3);
            }
            footer{
                color:#94a3b8;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="avatar">👨‍💻</div>
            <h1>Empty</h1>
            <span class="badge">个人主页</span>
            <p class="desc">爱好网页、折腾服务器与GitHub静态站点</p>

            <div class="links">
                <a class="link-item" href="/blog" aria-label="前往我的博客">📖 我的博客</a>
                <a class="link-item" href="/note" aria-label="前往云笔记">📝 云笔记</a>
                <a class="link-item" href="https://github.com/fox925" target="_blank" rel="noopener noreferrer" aria-label="访问Github">🐙 GitHub</a>
                <a class="link-item" href="#" aria-label="联系我">💬 联系我</a>
            </div>
        </div>
        <footer>
            © 2026 Empty | Powered by GitHub Pages
        </footer>
    </div>
</body>
</html>
