<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fox 的个人主页，记录博客、笔记与折腾日常" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Fox · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 40%, #fbc2eb 100%);
            background-attachment: fixed;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 56px 20px 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰圆 */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #c2e9fb;
            top: -80px;
            left: -80px;
        }

        body::after {
            width: 380px;
            height: 380px;
            background: #ffd6f5;
            bottom: -120px;
            right: -120px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow:
                0 20px 50px rgba(31, 41, 55, 0.15),
                0 8px 20px rgba(31, 41, 55, 0.08);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: white;
            box-shadow:
                0 10px 25px rgba(102, 126, 234, 0.45),
                0 0 0 6px rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 12px;
            color: #4f46e5;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            margin-bottom: 14px;
        }

        .desc {
            font-size: 15px;
            line-height: 1.7;
            color: #4b5563;
            margin-bottom: 28px;
        }

        .links {
            display: grid;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            text-decoration: none;
            color: #1f2937;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .link-item:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.35);
        }

        .link-item .icon {
            font-size: 20px;
        }

        footer {
            margin-top: 32px;
            font-size: 13px;
            color: #6b7280;
        }

        /* 暗黑模式 */
        @media (prefers-color-scheme: dark) {
            body {
                color: #f3f4f6;
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 40%, #6a11cb 100%);
            }

            body::before {
                background: #4f46e5;
            }

            body::after {
                background: #ec4899;
            }

            .card {
                background: rgba(17, 24, 39, 0.55);
                border-color: rgba(255, 255, 255, 0.12);
                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.35),
                    0 8px 20px rgba(0, 0, 0, 0.25);
            }

            .desc {
                color: #d1d5db;
            }

            .link-item {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.12);
                color: #f3f4f6;
            }

            .link-item:hover {
                background: linear-gradient(135deg, #818cf8, #c084fc);
                color: white;
            }

            footer {
                color: #9ca3af;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="avatar" aria-label="头像">🦊</div>
            <h1>Fox</h1>
            <span class="badge">GitHub Pages · Static Site</span>
            <p class="desc">
                爱好网页、折腾服务器与 GitHub 静态站点。<br />
                这里放我的博客、笔记和一些小项目入口。
            </p>

            <div class="links">
                <a class="link-item" href="/blog">
                    <span class="icon">📖</span>
                    <span>我的博客</span>
                </a>
                <a class="link-item" href="/note">
                    <span class="icon">📝</span>
                    <span>云笔记</span>
                </a>
                <a class="link-item" href="https://github.com/fox925" target="_blank" rel="noopener noreferrer">
                    <span class="icon">🐙</span>
                    <span>GitHub</span>
                </a>
                <a class="link-item" href="#">
                    <span class="icon">💬</span>
                    <span>联系我</span>
                </a>
            </div>

            <footer>
                © 2026 Fox · Powered by GitHub Pages
            </footer>
        </div>
    </div>
</body>
</html>
