<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fox 的个人主页 | 记录热爱、沉淀学习、分享折腾日常" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Fox · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #0f172a;
            background: #f8fafc;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 72px 20px 96px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        /* 顶部区域 */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
            padding-bottom: 40px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 32px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: linear-gradient(135deg, #0f172a, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            color: white;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
        }

        .hero-text h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .hero-text p {
            font-size: 15px;
            line-height: 1.7;
            color: #475569;
            max-width: 560px;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .tag {
            padding: 5px 12px;
            font-size: 12px;
            color: #334155;
            background: #eef2f7;
            border-radius: 999px;
        }

        /* 区域标题 */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        /* 链接网格 */
        .links {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 48px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            padding: 22px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            text-decoration: none;
            color: #0f172a;
            transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .link-item:hover {
            transform: translateY(-4px);
            border-color: #cbd5e1;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        .link-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .link-item h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .link-item span.desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        /* 底部 */
        footer {
            padding-top: 28px;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 暗黑模式 */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0b1220;
                color: #e2e8f0;
            }

            .hero {
                border-bottom-color: #1f2a44;
            }

            .tag {
                background: #1f2a44;
                color: #cbd5e1;
            }

            .link-item {
                background: #111a2e;
                border-color: #1f2a44;
                color: #e2e8f0;
            }

            .link-item:hover {
                border-color: #334155;
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
            }

            .link-icon {
                background: #1f2a44;
            }

            .link-item span.desc {
                color: #94a3b8;
            }

            footer {
                border-top-color: #1f2a44;
                color: #64748b;
            }
        }

        /* 移动端单列 */
        @media (max-width: 520px) {
            .links {
                grid-template-columns: 1fr;
            }

            .hero {
                align-items: center;
                text-align: center;
            }

            .hero-text {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            footer {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 顶部介绍 -->
        <section class="hero">
            <div class="avatar" aria-label="头像">🦊</div>
            <div class="hero-text">
                <h1>Fox</h1>
                <p>
                    专注前端开发、静态站点搭建与技术折腾。
                    在这里记录学习日常、技术笔记与个人项目。
                </p>
                <div class="meta-row">
                    <span class="tag">GitHub Pages</span>
                    <span class="tag">Cloudflare CDN</span>
                    <span class="tag">Static Site</span>
                </div>
            </div>
        </section>

        <!-- 链接入口 -->
        <h2 class="section-title">入口导航</h2>
        <div class="links">
            <a class="link-item" href="/blog">
                <div class="link-icon">📖</div>
                <h3>技术博客</h3>
                <span class="desc">记录学习过程与前端实践</span>
            </a>

            <a class="link-item" href="/note">
                <div class="link-icon">📝</div>
                <h3>个人笔记</h3>
                <span class="desc">整理常用命令、配置与踩坑笔记</span>
            </a>

            <a class="link-item" href="https://github.com/fox925" target="_blank" rel="noopener noreferrer">
                <div class="link-icon">🐙</div>
                <h3>GitHub 仓库</h3>
                <span class="desc">查看我的开源项目与代码作品</span>
            </a>

            <a class="link-item" href="#">
                <div class="link-icon">💬</div>
                <h3>交流联系</h3>
                <span class="desc">有问题或合作想法，欢迎联系</span>
            </a>
        </div>

        <footer>
            <span>© 2026 Fox</span>
            <span>Powered by GitHub Pages & Cloudflare CDN</span>
        </footer>
    </div>
</body>
</html>
