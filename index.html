<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Empty 的个人主页，记录博客、笔记与折腾日常" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Empty · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 40%, #fbc2eb 100%);
            background-attachment: fixed;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 56px 20px 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰圆 */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: #c2e9fb;
            top: -80px;
            left: -80px;
        }

        body::after {
            width: 380px;
            height: 380px;
            background: #ffd6f5;
            bottom: -120px;
            right: -120px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow:
                0 20px 50px rgba(31, 41, 55, 0.15),
                0 8px 20px rgba(31, 41, 55, 0.08);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: white;
            box-shadow:
                0 10px 25px rgba(102, 126, 234, 0.45),
                0 0 0 6px rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 12px;
            color: #4f46e5;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            margin-bottom: 14px;
        }

        .desc {
            font-size: 15px;
            line-height: 1.7;
            color: #4b5563;
            margin-bottom: 28px;
        }

        .links {
            display: grid;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            text-decoration: none;
            color: #1f2937;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .link-item:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.35);
        }

        .link-item .icon {
            font-size: 20px;
        }

        /* Cloudflare 节点状态卡 */
        .node-card {
            margin-top: 28px;
            padding: 20px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 18px 40px rgba(31, 41, 55, 0.12);
            text-align: left;
        }

        .node-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .node-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .node-icon {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f6821f, #faad3f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: 0 8px 18px rgba(246, 130, 31, 0.35);
        }

        .node-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            font-size: 12px;
            color: #065f46;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 999px;
        }

        .node-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
        }

        .node-body {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .node-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #111827;
        }

        .node-code {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            color: #f6821f;
            background: rgba(246, 130, 31, 0.12);
            border: 1px solid rgba(246, 130, 31, 0.25);
            border-radius: 8px;
            vertical-align: middle;
        }

        .node-sub {
            margin-top: 6px;
            font-size: 13px;
            color: #6b7280;
        }

        /* 信号条 */
        .signal {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 28px;
        }

        .signal span {
            display: block;
            width: 4px;
            background: rgba(156, 163, 175, 0.35);
            border-radius: 2px;
        }

        .signal .s1 { height: 25%; background: #10b981; }
        .signal .s2 { height: 50%; background: #10b981; }
        .signal .s3 { height: 75%; background: #10b981; }
        .signal .s4 { height: 100%; background: #10b981; }

        footer {
            margin-top: 32px;
            font-size: 13px;
            color: #6b7280;
        }

        /* 暗黑模式 */
        @media (prefers-color-scheme: dark) {
            body {
                color: #f3f4f6;
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 40%, #6a11cb 100%);
            }

            body::before {
                background: #4f46e5;
            }

            body::after {
                background: #ec4899;
            }

            .card {
                background: rgba(17, 24, 39, 0.55);
                border-color: rgba(255, 255, 255, 0.12);
                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.35),
                    0 8px 20px rgba(0, 0, 0, 0.25);
            }

            .desc {
                color: #d1d5db;
            }

            .link-item {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.12);
                color: #f3f4f6;
            }

            .link-item:hover {
                background: linear-gradient(135deg, #818cf8, #c084fc);
                color: white;
            }

            .node-card {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.14);
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.16),
                    0 18px 40px rgba(0, 0, 0, 0.35);
            }

            .node-title {
                color: #e5e7eb;
            }

            .node-status {
                color: #d1fae5;
                background: rgba(16, 185, 129, 0.14);
                border-color: rgba(16, 185, 129, 0.28);
            }

            .node-name {
                color: #f9fafb;
            }

            .node-sub {
                color: #9ca3af;
            }

            footer {
                color: #9ca3af;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="avatar" aria-label="头像">🦊</div>
            <h1>Empty</h1>
            <span class="badge">GitHub Pages · Static Site</span>
            <p class="desc">
                爱好网页、折腾服务器与 GitHub 静态站点。<br />
                这里放我的博客、笔记和一些小项目入口。
            </p>

            <div class="links">
                <a class="link-item" href="/blog">
                    <span class="icon">📖</span>
                    <span>我的博客</span>
                </a>
                <a class="link-item" href="/note">
                    <span class="icon">📝</span>
                    <span>云笔记</span>
                </a>
                <a class="link-item" href="https://github.com/empty232" target="_blank" rel="noopener noreferrer">
                    <span class="icon">🐙</span>
                    <span>GitHub</span>
                </a>
                <a class="link-item" href="#">
                    <span class="icon">💬</span>
                    <span>联系我</span>
                </a>
            </div>

            <!-- Cloudflare 节点状态卡 -->
            <div class="node-card">
                <div class="node-header">
                    <div class="node-title">
                        <div class="node-icon">☁️</div>
                        <span>Cloudflare CDN 节点</span>
                    </div>
                    <span class="node-status">
                        <span class="node-status-dot"></span>
                        <span id="nodeStatusText">连接中</span>
                    </span>
                </div>

                <div class="node-body">
                    <div>
                        <div class="node-name" id="nodeName">
                            <span id="nodeCity">加载中</span>
                            <span class="node-code" id="nodeCode">---</span>
                        </div>
                        <div class="node-sub" id="nodeSub">正在获取最近加速节点…</div>
                    </div>

                    <div class="signal" id="signal">
                        <span class="s1"></span>
                        <span class="s2"></span>
                        <span class="s3"></span>
                        <span class="s4"></span>
                    </div>
                </div>
            </div>

            <footer>
                © 2026 Empty · Powered by GitHub Pages
            </footer>
        </div>
    </div>

<script>
    const coloMap = {
        FRA:"德国 法兰克福",
        LHR:"英国 伦敦",
        AMS:"荷兰 阿姆斯特丹",
        CDG:"法国 巴黎",
        SJC:"美国 圣何塞",
        DFW:"美国 达拉斯",
        HKG:"中国香港",
        SIN:"新加坡",
        NRT:"日本 东京",
        ICN:"韩国 首尔",
        BKK:"泰国 曼谷",
        MUC:"德国 慕尼黑",
        MAD:"西班牙 马德里",
        FCO:"意大利 罗马",
        ARN:"瑞典 斯德哥尔摩",
        OSL:"挪威 奥斯陆",
        CPH:"丹麦 哥本哈根",
        DME:"俄罗斯 莫斯科",
        JFK:"美国 纽约",
        LAX:"美国 洛杉矶",
        ATL:"美国 亚特兰大",
        IAD:"美国 华盛顿",
        MIA:"美国 迈阿密",
        SEA:"美国 西雅图",
        YYZ:"加拿大多伦多",
        YVR:"加拿大温哥华",
        GRU:"巴西 圣保罗",
        EZE:"阿根廷 布宜诺斯艾利斯",
        JNB:"南非 约翰内斯堡",
        CAI:"埃及 开罗",
        DXB:"阿联酋 迪拜",
        AUH:"阿联酋 阿布扎比",
        KWI:"科威特 科威特城",
        DOH:"卡塔尔 多哈",
        BAH:"巴林 麦纳麦",
        ISB:"巴基斯坦 伊斯兰堡",
        KHI:"巴基斯坦 卡拉奇",
        DEL:"印度 新德里",
        BOM:"印度 孟买",
        MAA:"印度 金奈",
        HYD:"印度 海得拉巴",
        BLR:"印度 班加罗尔",
        CCU:"印度 加尔各答",
        KUL:"马来西亚 吉隆坡",
        TPE:"中国台北",
        TNA:"中国济南",
        TSJ:"中国三亚",
        SZX:"中国深圳",
        CAN:"中国广州",
        NNG:"中国南宁",
        KMG:"中国昆明",
        HGH:"中国杭州",
        SHA:"中国上海",
        PEK:"中国北京",
        XIY:"中国西安",
        CKG:"中国重庆",
        CTU:"中国成都",
        WUH:"中国武汉",
        HFE:"中国合肥",
        NKG:"中国南京",
        TSN:"中国天津",
        ZHA:"中国张家界",
        KHN:"中国南昌",
        FOC:"中国福州",
        XMN:"中国厦门",
        ZUH:"中国珠海",
        BHY:"中国北海",
        LZY:"中国洛阳",
        HET:"中国呼和浩特",
        URC:"中国乌鲁木齐",
        NX5:"中国宁夏",
        LHW:"中国兰州",
        XNN:"中国西宁",
        KWE:"中国贵阳",
        ZHA:"中国张家界",
        SWA:"中国揭阳"
    };

    const cityEl = document.getElementById("nodeCity");
    const codeEl = document.getElementById("nodeCode");
    const subEl = document.getElementById("nodeSub");
    const statusEl = document.getElementById("nodeStatusText");
    const signalEl = document.getElementById("signal");

    async function getCFNode() {
        try {
            const res = await fetch("/cdn-cgi/trace");
            if (!res.ok) throw new Error("trace failed");

            const text = await res.text();
            const coloMatch = text.match(/colo=(\w+)/);
            const locMatch = text.match(/loc=(\w+)/);
            const ipMatch = text.match(/ip=([\d:.a-fA-F]+)/);

            if (!coloMatch) {
                cityEl.textContent = "未检测到节点";
                codeEl.textContent = "---";
                subEl.textContent = "请确认域名已接入 Cloudflare 并开启代理";
                statusEl.textContent = "未连接";
                return;
            }

            const code = coloMatch[1];
            const location = coloMap[code] || `未知节点 ${code}`;

            cityEl.textContent = location;
            codeEl.textContent = code;
            statusEl.textContent = "已连接";

            if (ipMatch && locMatch) {
                subEl.textContent = `当前访问由 Cloudflare ${code} 边缘节点处理 · 访客 IP ${ipMatch[1]}`;
            } else {
                subEl.textContent = `当前访问由 Cloudflare ${code} 边缘节点处理`;
            }

            // 节点名渐入动画
            cityEl.parentElement.style.opacity = "0";
            cityEl.parentElement.style.transform = "translateY(6px)";
            cityEl.parentElement.style.transition = "all 0.3s ease";
            requestAnimationFrame(() => {
                cityEl.parentElement.style.opacity = "1";
                cityEl.parentElement.style.transform = "translateY(0)";
            });

            // 信号条动画
            const bars = signalEl.querySelectorAll("span");
            bars.forEach((bar, i) => {
                bar.style.opacity = "0";
                bar.style.transform = "scaleY(0.3)";
                bar.style.transition = "all 0.25s ease";
                setTimeout(() => {
                    bar.style.opacity = "1";
                    bar.style.transform = "scaleY(1)";
                }, 100 * i);
            });
        } catch (err) {
            cityEl.textContent = "获取失败";
            codeEl.textContent = "---";
            subEl.textContent = "网络异常或未通过 Cloudflare 访问";
            statusEl.textContent = "异常";
        }
    }

    getCFNode();
</script>
</body>
</html>
